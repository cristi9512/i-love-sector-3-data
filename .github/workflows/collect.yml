name: Collect incidents

# Archives the public Sector 3 reports (CityCare) into data/.
# Triggered every 15 minutes by an external scheduler (cron-job.org) through the
# GitHub API, with GitHub's own hourly schedule as a backup:
#   POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/collect.yml/dispatches
#   body: {"ref":"main"}
# The collector code lives in the site's repository, which is checked out each run.
# About once an hour the run also calls the Vercel deploy hook (secret
# VERCEL_DEPLOY_HOOK) so the site rebuilds its monthly and neighbourhood pages.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "Backfill start date (YYYY-MM-DD). Leave empty for a regular run."
        required: false
      to:
        description: "Backfill end date (YYYY-MM-DD). Defaults to today."
        required: false
  repository_dispatch:
    types: [collect]

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: cristi9512/i-love-sector-3-public
          ref: main
          path: code

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect
        env:
          DATA_DIR: ${{ github.workspace }}/data
          FROM: ${{ github.event.inputs.from }}
          TO: ${{ github.event.inputs.to }}
        run: |
          args=()
          if [ -n "$FROM" ]; then args+=(--from "$FROM"); fi
          if [ -n "$TO" ]; then args+=(--to "$TO"); fi
          node code/scripts/collect.mjs "${args[@]}"

      - name: Commit and push
        run: |
          git add data
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stats=$(node -e "const m=require('./data/meta.json').lastRunStats;console.log('+'+m.added+' new, '+m.updated+' updated, '+m.removed+' removed')")
          git commit -q -m "data: ${stats}"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Rebuild the site about once an hour
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          BACKFILL: ${{ github.event.inputs.from }}
        run: |
          if [ -z "$HOOK" ]; then echo "No VERCEL_DEPLOY_HOOK secret; skipping."; exit 0; fi
          minute=$(date -u +%M)
          if [ -z "$BACKFILL" ] && [ "$minute" -ge 20 ]; then echo "Not the hourly slot (minute $minute)."; exit 0; fi
          curl -fsS -X POST "$HOOK" -o /dev/null && echo "Site rebuild requested."
